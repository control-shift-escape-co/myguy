[project]
name = "myg"
version = "0.1.1"
description = "myg — your guy for agent apps. Scaffold a full CopilotKit + LangGraph agent app in one command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhi Avadhani" }]
keywords = ["agents", "langgraph", "copilotkit", "scaffold", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.7",
    "questionary>=2.0",
    "httpx>=0.27",
    "cookiecutter>=2.6",
    "cruft>=2.15",
    "tomli-w>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/control-shift-escape-co/myguy"
Documentation = "https://control-shift-escape-co.github.io/myguy"
Issues = "https://github.com/control-shift-escape-co/myguy/issues"

[project.scripts]
myg = "myg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myg"]
