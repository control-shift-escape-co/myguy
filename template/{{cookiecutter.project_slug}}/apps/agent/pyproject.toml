[project]
name = "{{ cookiecutter.project_slug }}-agent"
version = "0.1.0"
description = "{{ cookiecutter.description }} — LangGraph agent backend (AG-UI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.6,<2",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "ag-ui-langgraph>=0.0.40",
    "python-dotenv>=1.0",
{% if cookiecutter.gateway != "off" or cookiecutter.model.split(':')[0] == "openai" %}
    "langchain-openai>=0.3",
{% endif %}
{% if cookiecutter.model.split(':')[0] == "anthropic" %}
    "langchain-anthropic>=0.3",
{% endif %}
{% if cookiecutter.model.split(':')[0] == "gemini" %}
    "langchain-google-genai>=2.1",
{% endif %}
{% if cookiecutter.db != "sqlite" %}
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
{% else %}
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
{% endif %}
]

[dependency-groups]
dev = ["ruff>=0.9", "black>=25", "basedpyright>=1.28", "pytest>=8"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
