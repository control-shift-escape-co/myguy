name: docs

on:
  push:
    branches: [master]
    paths: ["docs/**", "mkdocs.yml"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --with mkdocs-material mkdocs gh-deploy --force
